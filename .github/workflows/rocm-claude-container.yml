name: rocm-claude-container

"on":
  push:
    branches:
      - chong/docker-claude
    paths:
      - '.devcontainer/rocm-azp-agent-in-docker-with-claude/Dockerfile'
      - '.github/workflows/rocm-claude-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rocm-claude-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: rocm-claude
  IMAGE_TAG_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        # The full image is large; reclaim space that GitHub Actions pre-installs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .devcontainer/rocm-azp-agent-in-docker-with-claude
          file: .devcontainer/rocm-azp-agent-in-docker-with-claude/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ env.IMAGE_TAG_SHA }}
          cache-from: type=gha,scope=rocm-claude-container
          cache-to: type=gha,mode=max,scope=rocm-claude-container

      - name: Print image URL
        run: |
          echo "Image pushed:"
          echo "  docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "  docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ env.IMAGE_TAG_SHA }}"
          echo ""
          echo "Pull with Singularity (no root needed):"
          echo "  singularity pull quokka-rocm-claude.sif docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
